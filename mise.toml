# Runtime versions are pinned here (mise manages *versions*).
# uv manages Python *deps*; pnpm manages JS *deps*. Do not move version pins elsewhere.
[tools]
node = "22.12.0"
python = "3.12.8"
pnpm = "9.15.0"
uv = "0.5.11"

[env]
# Load the repo .env for local development convenience.
_.file = ".env"
