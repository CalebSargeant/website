{% extends "base.html" %}
{% block body_class %}page-404{% endblock %}

{% block content %}

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <p class="kicker">{{ t('notfound.kicker') }}</p>
      <h1 class="mono grad-text">404</h1>
      <p class="lead">{{ t('notfound.lead') }}</p>
    </div>

    <div class="cta-row">
      {% for item in nav %}
      <a class="btn btn-ghost" href="{{ item.path }}">{{ item.nav }}</a>
      {% endfor %}
      <a class="btn btn-sig" data-magnetic href="{{ pdfs.cv }}" download>{{ t('cta.download_cv') }}</a>
    </div>
  </div>
</section>

{% endblock %}
