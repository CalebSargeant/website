[project]
name = "app-schemas"
version = "0.1.0"
description = "LOCAL Pydantic contract for THIS repo's NEW entities. Imports shared shapes from platform_schemas; never redefines them."
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.10.4",
    # SHARED contract (Pydantic side) — module `platform_schemas` from MagmaMoose/platform.
    # Sourcing is unresolved upstream (no published dist yet); see [tool.uv.sources] note.
    "platform-schemas",
]

# Upstream platform_schemas is not yet published. Point this at the real source
# once decided (registry, git subdir, or path). Example git form:
#   [tool.uv.sources]
#   platform-schemas = { git = "https://github.com/MagmaMoose/platform", subdirectory = "packages/schemas/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_schemas"]
