profile:
  location: Eindhoven, Nederland
  headline: Platform, Network & Security Engineer
  tagline: Platform, cloud, netwerk en security engineering sinds 2012.
  summary: Ik werk sinds 2012 in de IT, gespecialiseerd in platform engineering, automatisering, infrastructure
    as code, netwerken en security. Ik heb van alles beheerd, van bare-metal serverruimtes tot gevirtualiseerde
    platformen en cloud-native architecturen, en ik geef om systemen die betrouwbaar en onderhoudbaar
    zijn en saai blijven in productie. Ik neem verantwoordelijkheid voor complexe technische vraagstukken,
    of het nu gaat om het verbeteren van CI/CD, het ontwerpen van infrastructure as code of het beveiligen
    van netwerken en workloads, en ik hecht aan heldere, pragmatische communicatie.
  nationality_note: Gerechtigd om in de EU te werken (woon en werk in Nederland)
  availability:
    text: Open voor gesprekken over platform-, cloud- en netwerk/security-engineering.
  cover_letter:
    salutation: Geachte heer, mevrouw,
    paragraphs:
    - Sinds 2012 werk ik in uiteenlopende hoeken van de IT, met een sterke nadruk op platform engineering,
      automatisering, infrastructure as code, netwerken en security. Ik wil systemen bouwen die betrouwbaar
      en onderhoudbaar zijn, en ik pak elke uitdaging aan met oog voor helderheid, consistentie en verbetering.
    - Mijn ervaring beslaat platform engineering, netwerksecurity, cloud- en hybride infrastructuur, en daarnaast systeemautomatisering,
      scripting en open-source tooling. Ik heb in heel verschillende omgevingen gewerkt, van bare-metal
      servers tot gevirtualiseerde platformen en cloud-native architecturen, en daar oplossingen neergezet
      die veilig, schaalbaar en onderhoudbaar zijn. Ik neem graag verantwoordelijkheid voor complexe technische
      vraagstukken, of het nu gaat om het verbeteren van CI/CD-pipelines, het ontwerpen van infrastructure
      as code of het beveiligen van netwerken en workloads. Ik hecht aan heldere, pragmatische communicatie
      en werk graag samen met collega's aan systemen die in de praktijk doen wat nodig is.
    - U bent van harte welkom om mijn website, documentatie en GitHub te bekijken. Daar vindt u praktische
      voorbeelden van hoe ik als engineer werk en problemen oplos.
    - Heeft u vragen of wilt u de functie verder bespreken, dan ga ik daar graag over in gesprek. Dank
      voor uw tijd en aandacht.
    sign_off: Met vriendelijke groet,
