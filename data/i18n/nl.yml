roles:
  pinkroccade-cloud-engineer:
    type: Vast
    location: Nederland
    summary: 'Cloud- en platform engineering voor software voor de lokale overheid: Kubernetes-platformen,
      infrastructure as code en het migratiepad weg van legacy applicatiestacks.'
    highlights:
    - Cloud- en Kubernetes platform engineering voor workloads in de overheidssector.
    - Infrastructure as code en CI/CD voor applicatieteams.
    - Migratie en modernisering van legacy applicatieplatformen.
  tengen-devops-engineer:
    type: Contract
    location: Op afstand · Zuid-Afrika
    summary: 'Enige DevOps Engineer voor een multi-cloud omgeving: Kubernetes via GitOps, Terraform-modules,
      netwerken met WireGuard en MikroTik, en de monitoring die een camerapark in productie in de gaten
      houdt.'
    highlights:
    - Volledig declaratieve Kubernetes-clusters beheerd met FluxCD, met Kustomize- en Helm-templates per
      omgeving.
    - Terraform-modules geschreven en onderhouden voor EKS, VPC's, subnets, IAM, databases en VPN's in
      AWS, Azure en GCP.
    - Infrastructuur-secrets beveiligd met SOPS (GPG/AGE), opgeslagen in Git en ontsleuteld in CI.
    - MongoDB in productie geüpgraded van 4.4 naar 7, met replica sets, scheiding tussen staging en productie
      en offsite backups.
    - Opslagkosten op lange termijn verlaagd door schijfopruiming te automatiseren en backups met lifecycle
      rules naar S3 Glacier te verplaatsen.
    - Het cameraplatform voor live kentekenherkenning gebouwd en beheerd, met HTTPS op afstand, NTP/DNS-synchronisatie
      en reverse proxies.
    duties:
    - group: Infrastructuurautomatisering & cloudplatformen
      items:
      - Applicaties en services uitgerold en geconfigureerd met Ansible, Docker en Kubernetes.
      - Infrastructuur beheerd in AWS, Azure en GCP, inclusief provisioning, backupstrategie en kostenoptimalisatie.
      - Terraform-modules geschreven en onderhouden om EKS-clusters, VPC's, subnets, IAM, databases en
        VPN's uit te rollen.
      - Complexe workflows geautomatiseerd met GitHub Actions, Terraform en Ansible, voor betrouwbaardere
        deployments en consistentere infrastructuur.
    - group: Kubernetes, GitOps & secrets management
      items:
      - Kubernetes-clusters beheerd via GitOps-workflows met FluxCD, waarmee de clusterstatus volledig
        declaratief werd en deployments automatisch liepen.
      - Kustomize- en Helm-templates gemaakt en beheerd voor herbruikbare, omgevingsspecifieke Kubernetes-configuratie.
      - Infrastructuur-secrets beveiligd met SOPS, met GPG- en AGE-versleutelde secrets in Git, geïntegreerd
        in de CI/CD-pipelines.
      - Een veilige multi-omgevingsarchitectuur ontworpen met RBAC, service accounts en scheiding van
        namespaces.
      - Rancher en Atlantis tegen elkaar afgewogen voor Terraform-automatisering en het beheer van GitOps-workflows.
      - Terraform-repositories herstructureerd op modulariteit, security en schaalbaarheid.
    - group: Netwerken, VPN's & security
      items:
      - WireGuard- en L2TP-VPN's uitgerold en onderhouden, met veilige tunnels tussen MikroTik-routers,
        firewalls en cloudomgevingen.
      - VPN-connectiviteitsproblemen opgelost, toegang geregeld voor het interne team en externe partners,
        en VPN- en firewall-logs gecontroleerd.
      - Firewalls (SonicWall, MikroTik, FortiGate) geconfigureerd en onderhouden, met correcte routering
        en veilige netwerksegmentatie.
      - Infrastructuur gehard op basis van pentestresultaten, waaronder het sluiten van ongebruikte poorten,
        het harden van routers en het controleren van SSH-toegang.
    - group: Monitoring, logging & observability
      items:
      - Zabbix-monitoring opgezet en onderhouden voor camera's, routers, VPN's en VM-infrastructuur.
      - Alerting afgestemd om ruis in Slack te beperken en bruikbaarder inzicht te geven, waaronder het
        oplossen van dubbele alerts en alerting op S3-lifecycle.
      - Monitoring geautomatiseerd voor schijfgebruik, Mongo- en MySQL-performance en drempelwaarden voor
        systeemresources, met scripting en GitHub Actions.
    - group: CI/CD & deployment engineering
      items:
      - CI/CD-pipelines gebouwd en onderhouden met GitHub Actions, voor PR-workflows, geautomatiseerd
        testen, het vullen van databases en uitrol naar productie.
      - Meerdere backend- en frontendservices gedockeriseerd, uitgerold met PM2, en alerting ingericht
        op procesfouten en API-throttling.
      - Rollbackstrategieën, de scheiding tussen staging en productie en release-playbooks gedocumenteerd,
        zodat developers met meer vertrouwen en veiliger konden werken.
    - group: Infrastructuurbeheer
      items:
      - VM's beheerd in AWS, Azure en on-prem, waaronder schijfuitbreiding, imageproblemen, hoog CPU-
        en schijfgebruik en netwerkbeschikbaarheid.
      - Schijfopruiming geautomatiseerd, S3-lifecycle rules ingericht en backups naar S3 Glacier verplaatst
        om de opslagkosten op lange termijn te drukken.
      - Disaster-recovery plannen en procedures ontwikkeld en gedocumenteerd om legacy omgevingen opnieuw
        op te bouwen.
    - group: Databasebeheer
      items:
      - MongoDB-clusters geüpgraded van 4.4 naar 7, inclusief migratie, replica sets, scheiding tussen
        staging en productie en offsite backups.
      - MySQL onderhouden en getuned voor staging en productie, met het oplossen van connectiviteitsproblemen,
        verkeerde tijdzones en het beheer van gebruikerstoegang.
      - Backup- en monitoringscripts gebouwd voor de Zabbix-database, MongoDB en SonicWall-configuraties,
        zodat alles herstelbaar en controleerbaar bleef.
    - group: Camera- & IoT-infrastructuur
      items:
      - Camera's in productie uitgerold en onderhouden voor live kentekenherkenning, inclusief HTTPS op
        afstand, NTP/DNS-synchronisatie en reverse proxies.
      - Cameraspecifieke problemen opgelost, zoals wisselende leesresultaten, hoog dataverbruik, tijdzonefouten
        en dagelijkse reboots.
      - Tools gebouwd om beelden op te halen, haperende camera's te herstarten en te bevestigen dat het
        netwerkverkeer correct door de firewall liep.
      - Samengewerkt met derden en partners aan camera-uitrol, VPN-routering, IP-whitelisting en het oplossen
        van problemen op locatie.
    - group: Documentatie & support
      items:
      - Interne documentatie geschreven over de opzet van VPN en WireGuard, camera-installatie en HTTPS-integraties,
        backupstrategie en DR-procedures, en infrastructuurdiagrammen en uitrolplannen.
      - Onboarding-gidsen gemaakt voor engineers, gaten in legacy systemen gedicht en herbouwstrategieën
        voor legacy omgevingen vastgelegd voor rampscenario's.
      - Collega's en klanten consequent geholpen met database- en VPN-toegang, SSH-problemen en mislukte
        deployments.
    - group: Interne tooling & developer experience
      items:
      - Git-workflows verbeterd, met protected branches en een branchingstrategie voor zowel de IaC- als
        de applicatiecodebases.
      - Scripts ontwikkeld voor terugkerend werk, zoals VPN-statuscontroles, backups van Docker-containers,
        MongoDB-opschoning en het verlengen van certificaten.
      - Meegedaan aan toolevaluaties (DefectDojo, SonarQube, Infracost) en gezorgd dat de integraties
        in CI/CD werkten.
      - De developer experience verbeterd door ontwikkelomgevingen te dockeriseren, PM2-processen aan
        GitHub-repos te koppelen en snelle lokale onboarding mogelijk te maken.
    - group: Samenwerking & communicatie
      items:
      - Cross-functioneel samengewerkt met developers, systeembeheerders en infrastructure engineers.
      - Onboarding-sessies, planningsessies voor de camera-POC en ontwerpworkshops voor infrastructuur
        gehouden.
      - Rechtstreeks met stakeholders gecommuniceerd om kritieke problemen op te lossen, netwerkconfiguratie
        te ondersteunen en infrastructuuruitrol te plannen.
  budget-thuis-platform-engineer:
    type: Vast
    location: Amsterdam, Nederland
    location_note: Op afstand vanuit Kaapstad tot mei 2024
    summary: 'Azure platform engineering voor een Nederlandse energie- en telecomaanbieder: AKS, Terraform,
      het interne developerplatform en de CI/CD waar honderden .NET-services doorheen gaan.'
    highlights:
    - 'Azure-infrastructuur ontworpen, gebouwd en beheerd met Terraform: AKS-clusters, ACR, VNets, NSG''s
      en identity-integraties.'
    - De migratie van legacy Linux-VM's naar microservices op AKS geleid.
    - 'Het interne developerplatform gebouwd: herbruikbare, DRY infrastructuurmodules die de omgevingen
      en repositories van een nieuw team opzetten.'
    - Observability (Prometheus, Grafana, Blackbox Exporter) uitgerold over dev, test, acceptatie en productie.
    - Microsoft Entra ID gekoppeld aan Kubernetes RBAC, en IP-whitelisting, SSO en certificaatbeheer gecontroleerd.
    - 'Ingevallen als Scrum Master voor het platformteam: retrospectives begeleid en actiepunten omgezet
      in geprioriteerd engineeringwerk.'
    - Begonnen op afstand vanuit Kaapstad en na vijf maanden verhuisd naar Amsterdam.
    duties:
    - group: Infrastructure engineering
      items:
      - Azure-cloudinfrastructuur ontwerpen, implementeren en beheren met Terraform (AKS-clusters, ACR,
        VNets, NSG's, identity-integraties).
      - De migratie van legacy Linux-VM's naar moderne microservices op AKS leiden.
      - RabbitMQ-clusters op AKS beheren en onderhouden met FluxCD en Helm, inclusief vhost-configuratie,
        authenticatie, het inrichten van resources, ingress en het verzamelen van metrics.
      - Observability-stacks implementeren, waaronder Prometheus, Grafana en Blackbox Exporter, in alle
        omgevingen (dev, test, acc, prod).
      - Connectiviteits- en performanceproblemen onderzoeken en oplossen (Redis-timeouts, stabiliteit
        van RabbitMQ, fouten door volle schijven).
    - group: CI/CD en developer tooling
      items:
      - GitHub Actions-workflows en TeamCity-pipelines bouwen, verbeteren en debuggen voor .NET- en containerapplicaties.
      - 'GitHub-configuratie standaardiseren en documenteren: org secrets, repobeheer, forks en het onboarden
        van nieuwe developers.'
      - Kostenefficiënt gebruik van GitHub Actions en opslag onderzoeken en mogelijk maken (logs, caching,
        schijfruimte van runners).
      - Self-hosted GitHub runners opzetten en beheren, waaronder Windows-runners waarop Bash-scripts
        kunnen draaien.
      - Azure-authenticatie mogelijk maken in testworkflows en .NET restore-problemen in pipelines oplossen.
    - group: Intern developerplatform
      items:
      - Herbruikbare infrastructuurmodules ontwikkelen en onderhouden volgens het DRY-principe.
      - Omgevingen en repositories opzetten voor interne teams (Mobile Backend, Web API).
      - Gezamenlijke afspraken over omgevingen, naamgevingsconventies en toegangsbeheer vastleggen (GitHub,
        Azure, APIM).
      - Onboarding-gidsen, aanvraagformulieren en documentatie maken zodat interne teams het platform
        efficiënt kunnen gebruiken.
      - Interne API-managementflows ontwerpen en de APIM-configuratie ondersteunen voor publieke API's
        en interne services.
    - group: Security & identity
      items:
      - Microsoft Entra ID (Azure AD) koppelen aan Kubernetes RBAC voor rolgebaseerde toegang.
      - IP-whitelisting, SSO voor interne services en certificaatbeheer implementeren en controleren.
      - Zorgen dat het beheer van secrets en variabelen in GitHub en Azure voldoet aan least privilege
        en aan de best practices voor automatisering.
    - group: Platformbeheer & support
      items:
      - Support en runbooks leveren aan andere teams voor dagelijkse developerproblemen (GitHub, Redis,
        TeamCity, het inrichten van omgevingen).
      - Meedraaien in het supportrooster en de supportplanning en -processen documenteren.
      - Een servicedesk opzetten voor het platformteam, met intakeformulieren en triage van tickets voor
        interne aanvragen.
      - Problemen in productie en test oplossen, waaronder deployments van .NET-applicaties, AKS-problemen
        en uitdagingen met on-prem systemen.
    - group: Documentatie & procesondersteuning
      items:
      - Uitgebreide documentatie schrijven en onderhouden in Confluence over platformprocedures, onboarding,
        observability, CI/CD en infrastructuurstandaarden.
      - Wijzigingen aan monitoringstacks en deploymentpipelines bijwerken en documenteren.
      - Actiepunten uit retrospectives vastleggen en helpen om best practices door de sprints heen vast
        te houden.
    - group: Scrum Master-taken
      items:
      - 'Tijdelijk optreden als Scrum Master voor het platformteam: retrospectives begeleiden, sprints
        beheren en ceremonies organiseren.'
      - Zorgen dat actiepunten uit retrospectives worden omgezet in concrete engineeringtaken en geprioriteerd
        worden.
  byte-orbit-devsecops-engineer:
