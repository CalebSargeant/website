# Dutch overlay for the English source in data/*.yml and data/i18n/en.yml.
#
# Only what differs lives here. Anything absent falls back to English rather
# than rendering blank, and `make build` prints what is still falling back.
# Roles are keyed by their `id` from data/experience.yml, never by position,
# so reordering the English data cannot re-point a translation at another job.
#
# Job titles, company names, technologies and certifications stay in English
# on purpose: that is what a Dutch technical CV looks like.
