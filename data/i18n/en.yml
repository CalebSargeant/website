  whatdo.lead: Most of my work sits where two of these meet, which is usually where things break.
  whatdo.platform.title: Platform engineering
  whatdo.platform.body: Kubernetes, Terraform and GitOps, and the internal platform on top of them, so
    a product team can bootstrap its own environments and repositories without waiting on me to do it
    by hand.
  whatdo.cloud.title: Cloud infrastructure
  whatdo.cloud.body: 'Azure and AWS built as code rather than clicked together: AKS and EKS, networking,
    identity, and the unglamorous work of lifecycle rules and right-sized instances that keeps the monthly
    bill defensible.'
  whatdo.network.title: Networks
  whatdo.network.body: Routing, switching, firewalls and VPNs on Cisco, MikroTik and FortiGate, from a
    global multi-datacentre network on BGP and HSRP down to a single remote camera that has to come back
    on its own after a reboot.
  whatdo.security.title: Security
  whatdo.security.body: 'Hardening, identity and the application-security toolchain: SSO, MFA and PKI
    on one side, Dependency-Track, SonarQube, Trivy and ZAP wired into CI on the other, with findings
    tracked until they are actually closed.'
