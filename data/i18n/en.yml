# ═══════════════════════════════════════════════════════════════════════════
# English interface strings. This is the SOURCE locale.
#
# Two maps, both read by scripts/build.py:
#
#   ui:     flat dotted keys, the only thing t('key') can resolve. Every other
#           locale's file is an overlay on this one, so a key missing there
#           falls back to the English written here rather than rendering blank.
#           A key missing HERE is a hard failure: make_translator raises.
#   pages:  per page id, the <title>, the meta description and the nav label.
#           These duplicate the PAGES table in build.py on purpose. English
#           stays readable in context there; this file is what a translator
#           actually edits, and localise_page prefers it when it has a value.
#
# Rules for anything added here:
#   * Facts do not belong in this file. Names, employers, job titles, tech and
#     certification names come from data/*.yml and are translated (or not) by
#     the content overlay, never by t().
#   * Placeholders are Python str.format: "{years} years". A literal brace in a
#     string that also takes arguments will break the format call.
#   * One key per string. If the same sentence appears on two pages it gets one
#     key used twice, so a translator never has to notice the repetition.
# ═══════════════════════════════════════════════════════════════════════════
# ── page metadata ─────────────────────────────────────────────────────────
# The English half of the PAGES table. A locale overlay overrides any of these
# per page id; anything it leaves out falls back to what is written here.
