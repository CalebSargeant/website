# ═══════════════════════════════════════════════════════════════════════════
# Career history. THE source for three renderings:
#   * the site's /experience timeline   (company, title, dates, highlights)
#   * the CV PDF                        (company, title, dates, highlights)
#   * the JDs & Duties PDF              (everything, including `duties`)
#
# Field notes
#   start / end   YYYY-MM. `end: present` means current. Sorting and every
#                 duration on the site is computed from these. Never write a
#                 duration by hand.
#   focus         Tags the CV filter uses: platform | cloud | network |
#                 security | support. A role may carry several.
#   highlights    3-6 achievement bullets. These are what a recruiter reads.
#   duties        The long-form record, grouped. Only the JDs & Duties PDF and
#                 the expandable panel on /experience render these.
#   stack         Chips shown on the role card. Keep to ~10 of the real ones.
# ═══════════════════════════════════════════════════════════════════════════

