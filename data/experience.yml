      - Secured infrastructure secrets with SOPS (GPG/AGE) stored in Git and decrypted in CI.
      - Upgraded production MongoDB from 4.4 to 7 with replica sets, staging/prod separation and offsite backups.
      - Cut long-term storage cost by automating disk cleanup and moving backups to S3 Glacier with lifecycle rules.
      - Built and ran the production camera platform for live plate recognition, with remote HTTPS, NTP/DNS sync and reverse proxies.
