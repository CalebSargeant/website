name: Deploy site to Pages

# Builds the standalone apps/site (no @platform/* upstream needed) and publishes
# it to GitHub Pages. Runs on this feature branch while upstream sourcing is decided.
on:
  push:
    branches:
      - claude/golden-stack-consumer-scaffold-x7YZo
    paths:
      - "apps/site/**"
      - "content/profile.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (isolated from the monorepo workspace)
        working-directory: apps/site
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Build
        working-directory: apps/site
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
