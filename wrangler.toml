# Cloudflare Worker serving www.calebsargeant.com.
#
# An ASSETS-ONLY Worker: there is deliberately no `main` entrypoint. Cloudflare
# makes `main` optional when a Worker only serves static assets, and that is what
# we want here: asset requests are served straight from the edge, so they are
# free, have no cold start, and no code sits in the request path of a site whose
# entire job is to hand over pre-rendered HTML.
#
# It also keeps `_headers` authoritative: custom headers are NOT applied to
# responses generated by Worker code, so adding an entrypoint would silently
# strip the CSP from anything that entrypoint handled.
#
# `dist/` is produced by scripts/build.py and is not committed. Deploying without
# running the build first uploads nothing, which is the intended failure mode.

name = "calebsargeant-website"
compatibility_date = "2026-07-24"

# The site is canonical on www.calebsargeant.com only. Without this the exact
# same pages are also live on
# calebsargeant-website.<subdomain>.workers.dev, which is duplicate content that
# search engines will happily index and then rank against the real thing.
workers_dev = false

# `preview_urls` defaults to whatever `workers_dev` is set to, so turning
# workers.dev off would take per-PR preview URLs with it. They are independent
# settings: this line is what keeps `wrangler versions upload` previews working,
# and it must stay for as long as workers_dev is false.
preview_urls = true

[assets]
directory = "./dist"
# Serve 404.html with a real 404 status on unmatched paths. The default,
# "single-page-application", would return the homepage with HTTP 200: a soft 404
# that search engines penalise and that hides broken links from anyone auditing
# the site.
not_found_handling = "404-page"

# Hostnames: plain Workers routes, NOT `custom_domain = true`.
#
# The custom-domain API is the modern default and was the first thing tried. It
# cannot be used here: Cloudflare refuses to attach a Worker custom domain to a
# hostname that already owns a DNS record, and www.calebsargeant.com has had one
# since the Google Sites era. The deploy uploaded every asset and then failed on
#
#     A request to the Cloudflare API (.../domains/records) failed.
#
# with the API's error body swallowed by Wrangler. A read-only probe in the
# deploy workflow proved the token is correctly scoped (it can list this zone's
# Workers routes), so the record was the only cause.
#
# A route binds to a hostname that ALREADY has a proxied record, which is exactly
# the situation, and intercepts the request before it reaches the origin. So the
# Worker serves the site and the old Google Sites origin is simply never asked.
# Nothing about DNS changes, which also means there is no cutover window where
# the site is down between deleting a record and Wrangler recreating it.
#
# Both hostnames are served rather than redirected, because a Worker with no
# entrypoint cannot issue a redirect and `_redirects` matches on path only, never
# on hostname. Duplicate content is handled the way it is meant to be: every
# <link rel="canonical">, every og:url, every hreflang and every sitemap entry
# names https://www.calebsargeant.com, so search engines consolidate on www.
#
# To make the apex a real 301 instead, add a Cloudflare Redirect Rule on the zone
# (Rules -> Redirect Rules, apex -> www, 301). That needs Zone: Rulesets Edit,
# which the deploy token deliberately does not carry.
#
# The `/*` suffix is required: a route pattern without a path matches nothing.
[[routes]]
pattern = "www.calebsargeant.com/*"
zone_name = "calebsargeant.com"

[[routes]]
pattern = "calebsargeant.com/*"
zone_name = "calebsargeant.com"
